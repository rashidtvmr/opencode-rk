[package]
name = "opencode-rk-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oc2"
path = "src/main.rs"

# Compat alias: existing test harnesses and dev workflows invoke
# `CARGO_BIN_EXE_opencode-rk`. Same source, same behavior; release
# artifacts ship only `oc2` (see scripts/install-oc2.*).
[[bin]]
name = "opencode-rk"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
opencode-rk-catalog = { path = "../catalog" }
opencode-rk-contracts = { path = "../contracts" }
opencode-rk-opentui-bridge = { path = "../opentui-bridge", optional = true }
opencode-rk-sessions = { path = "../sessions" }
opencode-rk-server = { path = "../server" }
opencode-rk-storage = { path = "../storage" }
opencode-rk-tools = { path = "../tools" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
native = ["opencode-rk-opentui-bridge/native"]

[dev-dependencies]
opencode-rk-opentui-bridge = { path = "../opentui-bridge", features = ["native"] }
serde_json = "1"
