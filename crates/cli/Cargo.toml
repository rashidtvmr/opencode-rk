[package]
name = "opencode-rk-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oc2"
path = "src/main.rs"

# Compat alias: existing test harnesses and dev workflows invoke
# `CARGO_BIN_EXE_opencode-rk`. Same source, same behavior; release
# artifacts ship only `oc2` (see scripts/install-oc2.*).
[[bin]]
name = "opencode-rk"
path = "src/main.rs"

[dependencies]
regex-automata = "0.4"
unicode-segmentation.workspace = true
axum.workspace = true
clap.workspace = true
opencode-rk-catalog = { path = "../catalog" }
opencode-rk-contracts = { path = "../contracts" }
opencode-rk-foundation = { path = "../foundation" }
opencode-rk-opentui-bridge = { path = "../opentui-bridge", optional = true }
opencode-rk-providers = { path = "../providers" }
opencode-rk-sessions = { path = "../sessions" }
opencode-rk-server = { path = "../server" }
opencode-rk-storage = { path = "../storage" }
opencode-rk-tools = { path = "../tools" }
reqwest.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# The shipped product IS the native OpenTUI client, so `native` is on by
# default: `cargo build`, `cargo test` and `cargo check --workspace --locked`
# must cover the same code that ships. The non-native line-loop fallback
# remains reachable with `--no-default-features`.
default = ["native"]
native = ["opencode-rk-opentui-bridge/native"]

# UI-parity runtime harness (see crates/cli/tests/parity/README.md). Wraps the
# python-only styled-cell capture/comparator so `cargo test` proves real rendered
# cell equality against the recorded goldens, not just a self-test.
[[test]]
name = "ui_parity_harness"
path = "tests/parity/ui_parity_harness.rs"
required-features = ["native"]

[dev-dependencies]
opencode-rk-opentui-bridge = { path = "../opentui-bridge", features = ["native"] }
serde_json = "1"
tempfile.workspace = true
