name: release-gates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex source SHA to gate
        required: true
        type: string
      artifact_run_id:
        description: Controller-selected run id containing the release artifact
        required: true
        type: string
      provenance_run_id:
        description: Independent controller-selected run id containing trusted provenance
        required: true
        type: string
      mac_receipt_digest:
        description: Controller-supplied SHA-256 digest for the mac receipt
        required: true
        type: string
      web_receipt_digest:
        description: Controller-supplied SHA-256 digest for the web receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: r1 contract (static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Validate receipt/artifact contract schema and frozen test pins
        run: /usr/bin/python3 release/run_release_gates.py --source-sha "$SOURCE_SHA" --manifest-template release/release-gates.manifest.template.json --evidence-dir "$RUNNER_TEMP/r1-contract" --platform mac --platform web --platform ubuntu --check-contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      - name: Receipt validation unit tests
        run: /usr/bin/python3 -m unittest discover -s tests/release-gates -p 'test_*.py' -v

  mac-native:
    name: r1 mac native gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Fetch attested build artifact
        run: gh run download "$ARTIFACT_RUN_ID" -n macos-arm64-release -D "$RUNNER_TEMP/artifact" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Materialize attested concrete manifest
        run: /usr/bin/python3 release/materialize_release_manifest.py --template release/release-gates.manifest.template.json --build "$RUNNER_TEMP/artifact/build.json" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/r1-mac-manifest.json"
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      - name: Fetch external trusted provenance
        run: gh run download "$PROVENANCE_RUN_ID" -n mac-trusted-provenance.json -D "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Run frozen native paste-reset gate (exact SHA)
        run: /usr/bin/python3 release/run_release_gates.py --source-sha "$SOURCE_SHA" --manifest "$RUNNER_TEMP/r1-mac-manifest.json" --evidence-dir "$RUNNER_TEMP/r1-mac" --artifact-dir "$RUNNER_TEMP/artifact" --trusted-provenance "$TRUSTED_PROVENANCE" --expected-receipt-digest "$TRUSTED_RECEIPT_DIGEST" --platform mac --run
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TRUSTED_PROVENANCE: ${{ runner.temp }}/trusted-provenance.json
          TRUSTED_RECEIPT_DIGEST: ${{ inputs.mac_receipt_digest }}
      - uses: actions/upload-artifact@5d5d22a31266ced26887403a3e7a1b2a4a8c88a0 # v4.3.4
        if: always()
        with:
          name: mac-arm64-r1-receipts
          path: ${{ runner.temp }}/r1-mac
          if-no-files-found: error

  web-journey:
    name: r1 web journey (real rust router)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Fetch attested build artifact
        run: gh run download "$ARTIFACT_RUN_ID" -n linux-x64-release -D "$RUNNER_TEMP/artifact" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Materialize attested concrete manifest
        run: /usr/bin/python3 release/materialize_release_manifest.py --template release/release-gates.manifest.template.json --build "$RUNNER_TEMP/artifact/build.json" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/r1-web-manifest.json"
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      - name: Fetch external trusted provenance
        run: gh run download "$PROVENANCE_RUN_ID" -n web-trusted-provenance.json -D "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Run web journey gate (real Rust auth/router daemon)
        run: /usr/bin/python3 release/run_release_gates.py --source-sha "$SOURCE_SHA" --manifest "$RUNNER_TEMP/r1-web-manifest.json" --evidence-dir "$RUNNER_TEMP/r1-web" --artifact-dir "$RUNNER_TEMP/artifact" --trusted-provenance "$TRUSTED_PROVENANCE" --expected-receipt-digest "$TRUSTED_RECEIPT_DIGEST" --platform web --run
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TRUSTED_PROVENANCE: ${{ runner.temp }}/trusted-provenance.json
          TRUSTED_RECEIPT_DIGEST: ${{ inputs.web_receipt_digest }}
      - uses: actions/upload-artifact@5d5d22a31266ced26887403a3e7a1b2a4a8c88a0 # v4.3.4
        if: always()
        with:
          name: web-x64-r1-receipts
          path: ${{ runner.temp }}/r1-web
          if-no-files-found: error

  ubuntu-tool-gates-contract:
    name: r1 ubuntu tool-gate contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify retained runner hash and --tool-gates wiring
        run: /usr/bin/python3 release/run_release_gates.py --source-sha "$SOURCE_SHA" --manifest-template release/release-gates.manifest.template.json --evidence-dir "$RUNNER_TEMP/r1-ubuntu" --platform ubuntu --tool-gates --check-contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
