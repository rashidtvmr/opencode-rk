[workspace]
members = [
  "crates/agents",
  "crates/contracts",
  "crates/foundation",
  "crates/storage",
  "crates/security",
  "crates/sessions",
  "crates/catalog",
  "crates/server",
  "crates/cli",
  "crates/providers",
  "crates/tools",
  "crates/opentui-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
unicode-segmentation = "=1.13.3"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4.3"
include_dir = "0.7.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = "1.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# DIALOG-20 crash half: the release profile must permit unwinding so the
# render-loop `catch_unwind` seam (crates/cli/src/tui_entry.rs) can surface
# the crash toast + crash surface in the shipped binary. `panic = "abort"`
# made that seam inert in release (the hook ran, then the process died with
# no Drop, no terminal restore, no surface). No site relies on abort
# semantics: CLI background workers report failure through mpsc
# disconnection (`native_setup.rs` "model discovery interrupted",
# `tui_entry.rs` "compact worker stopped without a response"), the security
# crate's locks are poisoning-tolerant (`security/src/lib.rs:276,300,304,442`),
# and the server's spawned stream tasks close their channels on panic
# (truncated response, daemon survives) — the tokio norm. Guarded by
# `release_profile_permits_unwind` in `crates/cli/src/tui_entry.rs`.

[profile.dev]
debug = 1
